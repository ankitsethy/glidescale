<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- SEO -->
    <title>Glidescale AI | AI Operating Systems for Growth-Stage Founders</title>
    <meta name="description" content="Glidescale AI builds AI-backed operating infrastructure for growth-stage companies. We replace manual drag with scalable outbound, revenue, and execution systems — deployed in 8 weeks." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.glidescales.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="Glidescale AI | AI Operating Systems for Growth-Stage Founders" />
    <meta property="og:description" content="We build AI-backed operating infrastructure that removes the bottlenecks holding your growth back. Outbound, revenue architecture, and execution frameworks — deployed fast." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glidescale AI" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://glidescales.com" />
    <meta property="og:image" content="https://glidescales.com/og-image.png" />
    <!-- Must match the output of scripts/og-image.mjs -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Glidescale. AI systems that remove bottlenecks and unlock scale." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glidescale AI | AI Operating Systems for Growth-Stage Founders" />
    <meta name="twitter:description" content="We build AI-backed operating infrastructure that removes the bottlenecks holding your growth back." />
    <meta name="twitter:image" content="https://glidescales.com/og-image.png" />
    <meta name="twitter:image:alt" content="Glidescale. AI systems that remove bottlenecks and unlock scale." />

    <!-- Entity signals. "Glidescale" is a contested brand term, so sameAs links
         are what let Google tie this site to the right organisation. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Glidescale",
        "alternateName": "Glidescale AI",
        "url": "https://www.glidescales.com",
        "logo": "https://www.glidescales.com/apple-touch-icon.png",
        "image": "https://www.glidescales.com/og-image.png",
        "description": "Glidescale builds AI-backed operating infrastructure for growth-stage companies, across outbound, revenue operations, and internal workflows.",
        "email": "ankitsethy.ai@gmail.com",
        "founder": {
          "@type": "Person",
          "name": "Ankit Sethy",
          "jobTitle": "Founder",
          "sameAs": [
            "https://www.linkedin.com/in/ankit-sethy-/",
            "https://x.com/ankitsethy_"
          ]
        },
        "sameAs": [
          "https://www.linkedin.com/in/ankit-sethy-/",
          "https://x.com/ankitsethy_"
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Vite will inject the bundled CSS here -->
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
